<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dadu Surgawi</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-top: 15px;
        }

        h1 {
            font-size: 1.6rem;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #e0e0e0;
            opacity: 0.9;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            margin: auto 0;
        }

        /* Area Papan Dadu 3D Sejati */
        .dice-board {
            display: flex;
            gap: 45px;
            margin: 50px 0;
            perspective: 1000px;
        }

        /* Struktur Kubus Dadu 3D */
        .dice {
            width: 85px;
            height: 85px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 2.2s cubic-bezier(0.15, 0.85, 0.25, 1);
            will-change: transform;
        }

        .face {
            position: absolute;
            width: 85px;
            height: 85px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.15);
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 12px;
            border: 1px solid #dcdcdc;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Posisi Sisi-sisi Kubus 3D (Setengah dari 85px = 42.5px) */
        .face-1 { transform: rotateY(0deg) translateZ(42.5px); }
        .face-2 { transform: rotateY(180deg) translateZ(42.5px); }
        .face-3 { transform: rotateY(-90deg) translateZ(42.5px); }
        .face-4 { transform: rotateY(90deg) translateZ(42.5px); }
        .face-5 { transform: rotateX(90deg) translateZ(42.5px); }
        .face-6 { transform: rotateX(-90deg) translateZ(42.5px); }

        /* Titik Dot Dadu Standar */
        .dot {
            background-color: #111;
            border-radius: 50%;
            width: 13px;
            height: 13px;
            align-self: center;
            justify-self: center;
            display: none;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.4);
        }

        /* Konfigurasi Titik Standar Dadu Asli */
        /* Angka 1: Hanya 1 titik di tengah persis */
        .face-1 .dot-center { display: block; grid-column: 2; grid-row: 2; }

        /* Angka 2: Pojok kiri atas & kanan bawah */
        .face-2 .dot-t-l { display: block; grid-column: 1; grid-row: 1; }
        .face-2 .dot-b-r { display: block; grid-column: 3; grid-row: 3; }

        /* Angka 3: Kiri atas, tengah, kanan bawah */
        .face-3 .dot-t-l { display: block; grid-column: 1; grid-row: 1; }
        .face-3 .dot-center { display: block; grid-column: 2; grid-row: 2; }
        .face-3 .dot-b-r { display: block; grid-column: 3; grid-row: 3; }

        /* Angka 4: Keempat sudut */
        .face-4 .dot-t-l { display: block; grid-column: 1; grid-row: 1; }
        .face-4 .dot-t-r { display: block; grid-column: 3; grid-row: 1; }
        .face-4 .dot-b-l { display: block; grid-column: 1; grid-row: 3; }
        .face-4 .dot-b-r { display: block; grid-column: 3; grid-row: 3; }

        /* Angka 5: Keempat sudut + tengah */
        .face-5 .dot-t-l { display: block; grid-column: 1; grid-row: 1; }
        .face-5 .dot-t-r { display: block; grid-column: 3; grid-row: 1; }
        .face-5 .dot-center { display: block; grid-column: 2; grid-row: 2; }
        .face-5 .dot-b-l { display: block; grid-column: 1; grid-row: 3; }
        .face-5 .dot-b-r { display: block; grid-column: 3; grid-row: 3; }

        /* Angka 6: Tiga di kiri, tiga di kanan */
        .face-6 .dot-t-l { display: block; grid-column: 1; grid-row: 1; }
        .face-6 .dot-m-l { display: block; grid-column: 1; grid-row: 2; }
        .face-6 .dot-b-l { display: block; grid-column: 1; grid-row: 3; }
        .face-6 .dot-t-r { display: block; grid-column: 3; grid-row: 1; }
        .face-6 .dot-m-r { display: block; grid-column: 3; grid-row: 2; }
        .face-6 .dot-b-r { display: block; grid-column: 3; grid-row: 3; }

        /* Tombol Lempar Eksklusif */
        .roll-btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #333;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 35px;
            box-shadow: 0 6px 20px rgba(253, 160, 133, 0.4);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            width: 100%;
            max-width: 260px;
            letter-spacing: 0.5px;
        }

        .roll-btn:active {
            transform: scale(0.95);
        }

        /* Modal Pop-up Eksklusif */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 25, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(145deg, #ffffff, #f7f9fc);
            width: 100%;
            max-width: 330px;
            border-radius: 24px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(255, 215, 0, 0.2);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 215, 0, 0.5);
            color: #333;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .badge-lucky {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            box-shadow: 0 4px 10px rgba(56, 239, 125, 0.3);
        }

        .badge-unlucky {
            background: linear-gradient(135deg, #cb2d3e, #ef473a);
            color: white;
            box-shadow: 0 4px 10px rgba(239, 71, 58, 0.3);
        }

        .modal-title {
            font-size: 1.25rem;
            color: #2b1055;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .modal-message {
            font-size: 0.92rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .close-btn {
            background: linear-gradient(135deg, #2b1055, #7597de);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(43, 16, 85, 0.3);
        }

        footer {
            font-size: 0.75rem;
            color: #fff;
            opacity: 0.7;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ mendadu ✨</h1>
        <p class="subtitle">Ungkap misteri </p>
    </header>

    <div class="game-container">
        <div class="dice-board">
            <!-- Dadu 1 -->
            <div class="dice" id="dice1">
                <div class="face face-1"><div class="dot dot-center"></div></div>
                <div class="face face-2"><div class="dot dot-t-l"></div><div class="dot dot-b-r"></div></div>
                <div class="face face-3"><div class="dot dot-t-l"></div><div class="dot dot-center"></div><div class="dot dot-b-r"></div></div>
                <div class="face face-4"><div class="dot dot-t-l"></div><div class="dot dot-t-r"></div><div class="dot dot-b-l"></div><div class="dot dot-b-r"></div></div>
                <div class="face face-5"><div class="dot dot-t-l"></div><div class="dot dot-t-r"></div><div class="dot dot-center"></div><div class="dot dot-b-l"></div><div class="dot dot-b-r"></div></div>
                <div class="face face-6"><div class="dot dot-t-l"></div><div class="dot dot-m-l"></div><div class="dot dot-b-l"></div><div class="dot dot-t-r"></div><div class="dot dot-m-r"></div><div class="dot dot-b-r"></div></div>
            </div>

            <!-- Dadu 2 -->
            <div class="dice" id="dice2">
                <div class="face face-1"><div class="dot dot-center"></div></div>
                <div class="face face-2"><div class="dot dot-t-l"></div><div class="dot dot-b-r"></div></div>
                <div class="face face-3"><div class="dot dot-t-l"></div><div class="dot dot-center"></div><div class="dot dot-b-r"></div></div>
                <div class="face face-4"><div class="dot dot-t-l"></div><div class="dot dot-t-r"></div><div class="dot dot-b-l"></div><div class="dot dot-b-r"></div></div>
                <div class="face face-5"><div class="dot dot-t-l"></div><div class="dot dot-t-r"></div><div class="dot dot-center"></div><div class="dot dot-b-l"></div><div class="dot dot-b-r"></div></div>
                <div class="face face-6"><div class="dot dot-t-l"></div><div class="dot dot-m-l"></div><div class="dot dot-b-l"></div><div class="dot dot-t-r"></div><div class="dot dot-m-r"></div><div class="dot dot-b-r"></div></div>
            </div>
        </div>

        <button class="roll-btn" id="rollBtn" onclick="rollDice3D()">kocok sini ✨</button>
    </div>

    <!-- Modal Pop-up Eksklusif -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div id="modalBadgeContainer"></div>
            <h3 class="modal-title" id="modalTitle">gimana hasilnya?</h3>
            <p class="modal-message" id="modalMessage">Menyusun takdir cinta...</p>
            <button class="close-btn" onclick="closeModal()">kocok ulang💦💦💦</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Exclusive Mobile Edition
    </footer>

    <script>
        const luckyFortunes = [
            "Angka kembar mistis! Getaran cinta kalian berada pada frekuensi tertinggi. Sinyal semesta mendukung langkah romantis hari ini.",
            "Penyatuan dua energi yang selaras. Hubungan asmaramu dipenuhi hoki besar, kejutan manis, dan ketulusan mendalam.",
            "Double Blessing! Pintu takdir terbuka lebar bagi kisah cintamu. Pesona dan daya tarikmu sedang memancar sangat kuat.",
            "Keberuntungan mutlak dalam asmara! Ikatan emosional semakin erat dan komunikasi berjalan tanpa hambatan.",
            "Harmoni sempurna! Semesta merestui setiap niat baik yang ingin kamu tunjukkan kepada pasangan."
        ];

        const unluckyFortunes = [
            "Ujian takdir melintang. Ego dan kesalahpahaman kecil berpotensi memicu gesekan. Kendalikan emosi dengan bijak.",
            "Fase pendinginan asmara. Saluran komunikasi sedang tertutup kabut keraguan; bersabarlah dan hindari mengambil keputusan gegabah.",
            "Roda asmara berada di titik bawah sementara. Jangan mudah terprovokasi oleh rumor atau prasangka negatif.",
            "Waktunya introspeksi diri. Berikan ruang privasi kepada pasangan agar ketegangan mereda secara alami.",
            "Energi semesta sedang tidak seimbang. Tunda dulu niat menyatakan perasaan atau membahas topik sensitif hari ini."
        ];

        const rotations = {
            1: { x: 0, y: 0 },
            2: { x: 0, y: 180 },
            3: { x: 0, y: 90 },
            4: { x: 0, y: -90 },
            5: { x: -90, y: 0 },
            6: { x: 90, y: 0 }
        };

        function getRandomFortune(array) {
            const randomIndex = Math.floor(Math.random() * array.length);
            return array[randomIndex];
        }

        function rollDice3D() {
            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');
            const rollBtn = document.getElementById('rollBtn');

            rollBtn.disabled = true;

            const val1 = Math.floor(Math.random() * 6) + 1;
            const val2 = Math.floor(Math.random() * 6) + 1;

            const extraRotX = 360 * (Math.floor(Math.random() * 2) + 3);
            const extraRotY = 360 * (Math.floor(Math.random() * 2) + 3);

            const targetRot1 = rotations[val1];
            const targetRot2 = rotations[val2];

            dice1.style.transform = `rotateX(${targetRot1.x + extraRotX}deg) rotateY(${targetRot1.y + extraRotY}deg)`;
            dice2.style.transform = `rotateX(${targetRot2.x + extraRotX}deg) rotateY(${targetRot2.y + extraRotY}deg)`;

            setTimeout(() => {
                showModal(val1, val2);
                rollBtn.disabled = false;
            }, 2200);
        }

        function showModal(v1, v2) {
            const overlay = document.getElementById('modalOverlay');
            const badgeContainer = document.getElementById('modalBadgeContainer');
            const titleEl = document.getElementById('modalTitle');
            const messageEl = document.getElementById('modalMessage');

            const isDouble = (v1 === v2);

            titleEl.innerText = `Kombinasi Dadu: [ ${v1} & ${v2} ]`;

            if (isDouble) {
                badgeContainer.innerHTML = `<span class="modal-badge badge-lucky">✨ Keberuntungan Ganda ✨</span>`;
                messageEl.innerText = getRandomFortune(luckyFortunes);
            } else {
                badgeContainer.innerHTML = `<span class="modal-badge badge-unlucky">⚡ Ujian Asmara ⚡</span>`;
                messageEl.innerText = getRandomFortune(unluckyFortunes);
            }

            overlay.classList.add('active');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('active');
        }
    </script>
</body>
</html>
